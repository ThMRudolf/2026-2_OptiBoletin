<!DOCTYPE html>
<!--
  optativas_boletin.html
  Generador de Boletín de Optativas — ITAM · División Académica de Ingeniería

  Descripción:
    Aplicación web de una sola página (SPA) que permite generar un boletín
    de materias optativas en formato .docx a partir de un archivo Excel (.xlsx).

  Flujo de tres pasos:
    1. Cargar       — opción A: seleccionar la carpeta con los anuncios .docx de
                      los departamentos; se leen en el navegador (docx_parser.js,
                      port de py/docx_to_excel.py) y pueden descargarse como Excel.
                      Opción B: subir un Excel existente con columnas A-F:
                      Departamento, Código, Título, Profesor, Prerrequisitos,
                      Descripción. La columna A puede estar vacía;
                      el departamento se infiere del prefijo del código (ECO, IIO…).
    2. Seleccionar  — filtrar por departamento o búsqueda de texto, marcar las
                      materias que se incluirán en el boletín.
    3. Generar      — elegir programa(s) académico(s) (máx. 2) y descargar el
                      documento Word generado.

  Archivos relacionados:
    optativas_boletin.css  — estilos (tipografía, paleta ITAM, componentes)
    optativas_boletin.js   — lógica React/JSX (constantes, generación de .docx,
                             lectura de Excel, componentes de UI)
    docx_parser.js         — lectura de anuncios .docx → materias / .xlsx

  Dependencias CDN (no se requiere instalación local):
    React 18 + ReactDOM      — componentes y renderizado
    Babel standalone         — transpila JSX en el navegador en tiempo real
    JSZip 3.10.1             — empaqueta los archivos XML del .docx
    SheetJS / xlsx 0.18.5    — lee el .xlsx subido por el usuario

  Tipografías (Google Fonts):
    Crimson Pro  — texto de cuerpo y botones
    DM Mono      — códigos de materia, etiquetas y elementos monospace
-->
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generador de Boletín de Optativas — ITAM</title>

  <!-- Tipografías institucionales -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <!-- Estilos de la aplicación -->
  <link rel="stylesheet" href="../css/optativas_boletin.css"/>

  <!-- Dependencias de React (UMD, sin paso de build) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Generación de archivos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- Punto de montaje de React -->
<div id="root"></div>

<!-- Lector de documentos Word (JS plano, expone window.OptiParser) -->
<script src="../js/docx_parser.js"></script>

<!-- Lógica de la aplicación (JSX transpilado por Babel en el navegador) -->
<script type="text/babel" src="../js/optativas_boletin.js"></script>

</body>
</html>
