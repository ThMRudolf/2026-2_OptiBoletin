<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Generador de Boletín de Optativas — ITAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; background: #f5f4f0; font-family: 'Crimson Pro', Georgia, serif; }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes progbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @keyframes fadeUp  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade { animation: fadeUp .3s ease both; }

  /* Drop zone */
  .drop-z { border: 1.5px dashed #b8b3aa; border-radius: 8px; padding: 28px 20px; text-align: center;
    cursor: pointer; background: #faf9f7; transition: all .15s; margin-bottom: 16px; }
  .drop-z:hover, .drop-z.over { border-color: #1F3864; background: #eef2f8; }

  /* Checkboxes */
  .chk { width: 16px; height: 16px; border: 1.5px solid #cbd5e1; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .15s; cursor: pointer; user-select: none; }
  .chk.on      { background: #1F3864; border-color: #1F3864; }
  .chk.partial { background: #e2e8f0; border-color: #94a3b8; }
  .chk-mark    { color: #fff; font-size: 10px; line-height: 1; }
  .chk-dash    { color: #64748b; font-size: 11px; font-weight: 700; line-height: 1; }

  /* Rows */
  .dept-hdr { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    cursor: pointer; transition: background .1s; border-bottom: 1px solid #e2e8f0; }
  .dept-hdr:hover { background: #f8fafc; }
  .course-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 14px;
    border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background .1s; }
  .course-row:last-child { border-bottom: none; }
  .course-row:hover { background: #f8fafc; }

  /* Buttons */
  .btn-blue { background: #1F3864; color: #e8ecf4; border: none; padding: 11px 24px;
    font-family: 'Crimson Pro', serif; font-size: 16px; font-weight: 500; cursor: pointer;
    border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; transition: background .12s; }
  .btn-blue:hover:not(:disabled) { background: #2c4f8a; }
  .btn-blue:disabled { opacity: .4; cursor: not-allowed; }
  .btn-green { background: #15803d; color: #f0fdf4; border: none; padding: 11px 24px;
    font-family: 'Crimson Pro', serif; font-size: 16px; font-weight: 500; cursor: pointer;
    border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; transition: background .12s; }
  .btn-green:hover:not(:disabled) { background: #166534; }
  .btn-green:disabled { opacity: .4; cursor: not-allowed; }
  .btn-sec { background: none; border: 1px solid #c8c4bc; color: #555; padding: 9px 16px;
    font-family: 'Crimson Pro', serif; font-size: 15px; cursor: pointer; border-radius: 6px;
    transition: background .1s; }
  .btn-sec:hover { background: #eae8e2; }

  /* Misc */
  .spinner { border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  .prog-bar { height: 3px; background: #dbeafe; border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .prog-inner { height: 100%; width: 55%; background: #1d4ed8; border-radius: 2px; animation: progbar 1.4s ease-in-out infinite; }
  .search-bar { width: 100%; font-family: 'Crimson Pro', serif; font-size: 15px; border: 1px solid #e2e8f0;
    border-radius: 6px; padding: 9px 14px; background: #f8fafc; color: #1e293b;
    outline: none; transition: border .15s; }
  .search-bar:focus { border-color: #1F3864; }
  .tag-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 4px; font-size: 12px; }
  .pill { font-family: 'DM Mono', monospace; font-size: 10px; background: #f1f5f9; color: #475569;
    padding: 2px 6px; border-radius: 3px; flex-shrink: 0; margin-top: 2px; white-space: nowrap; }
  .mono { font-family: 'DM Mono', monospace; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px 28px; margin-bottom: 16px; }
  .step-line { flex: 1; height: 1px; margin: 0 12px; transition: background .3s; }

</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const DEPT_ORDER = ["Administración","Bienestar / Formación General","Ciencia Política","Computación","Contabilidad","Derecho","Economía","Estudios Generales","Estudios Internacionales","Ingeniería / Interdepartamental","Ingeniería Industrial y Operaciones","Matemáticas"];
const DEPT_COLORS = {"Administración":"#2563eb","Computación":"#7c3aed","Contabilidad":"#0891b2","Economía":"#059669","Ingeniería Industrial y Operaciones":"#c2410c","Ingeniería / Interdepartamental":"#b45309","Matemáticas":"#be185d","Derecho":"#4338ca","Estudios Generales":"#0f766e","Estudios Internacionales":"#0369a1","Ciencia Política":"#7e22ce","Bienestar / Formación General":"#15803d"};
const DEPT_BG = {"Administración":"#eff6ff","Computación":"#f5f3ff","Contabilidad":"#ecfeff","Economía":"#f0fdf4","Ingeniería Industrial y Operaciones":"#fff7ed","Ingeniería / Interdepartamental":"#fffbeb","Matemáticas":"#fdf2f8","Derecho":"#eef2ff","Estudios Generales":"#f0fdfa","Estudios Internacionales":"#f0f9ff","Ciencia Política":"#faf5ff","Bienestar / Formación General":"#f0fdf4"};
const DEPT_DISPLAY = {"Administración":"ADMINISTRACIÓN","Bienestar / Formación General":"BIENESTAR / FORMACIÓN GENERAL","Ciencia Política":"CIENCIA POLÍTICA","Computación":"COMPUTACIÓN","Contabilidad":"CONTABILIDAD","Derecho":"DERECHO","Economía":"ECONOMÍA","Estudios Generales":"ESTUDIOS GENERALES","Estudios Internacionales":"ESTUDIOS INTERNACIONALES","Ingeniería / Interdepartamental":"INGENIERÍA ELÉCTRICA Y ELECTRÓNICA / INTERDEPARTAMENTAL","Ingeniería Industrial y Operaciones":"INGENIERÍA INDUSTRIAL Y OPERACIONES","Matemáticas":"MATEMÁTICAS"};
const PROGRAMS = ["Actuaría","Administración de Negocios","Ciencia de Datos","Ciencia Política","Contaduría Analítica y Finanzas Corporativas","Derecho","Dirección Financiera","Dirección de Mercadotecnia","Economía","Matemáticas Aplicadas","Relaciones Internacionales","Ingeniería en Inteligencia Artificial","Ingeniería y Ciencias de la Computación","Ingeniería Industrial y en Sistemas Inteligentes","Ingeniería en Mecatrónica y Robótica Inteligente","Ingeniería en Negocios"];

// ─── DOCX GENERATION ─────────────────────────────────────────────────────────
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;"); }
function wRun(text, bold, size=20, color="000000") {
  const b = bold ? "<w:b/><w:bCs/>" : "";
  return `<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="${size}"/><w:szCs w:val="${size}"/>${b}<w:color w:val="${color}"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
}
function wPara(runs, {before=0,after=80,jc="",indent="",shading=""}={}) {
  return `<w:p><w:pPr>${shading?`<w:shd w:val="clear" w:color="auto" w:fill="${shading}"/>`:""}` +
    `<w:spacing w:before="${before}" w:after="${after}" w:line="276" w:lineRule="auto"/>` +
    `${jc?`<w:jc w:val="${jc}"/>`:""}${indent?`<w:ind w:left="${indent}"/>`:""}` +
    `</w:pPr>${runs}</w:p>`;
}
function courseToXml(c) {
  let out = "";
  out += wPara(wRun(`${c.code}   `,true,20)+wRun(c.title,true,20),{before:200,after:60});
  const profLines=(c.professor||"").split("\n");
  out += wPara(wRun("PROFESOR: ",true)+wRun(profLines[0]||""),{after:40});
  for(let i=1;i<profLines.length;i++) out+=wPara(wRun(profLines[i]),{after:40,indent:"1260"});
  const preLines=(c.prerequisites||"Ninguno").split("\n");
  out += wPara(wRun("PRERREQUISITOS: ",true)+wRun(preLines[0]),{after:40});
  for(let i=1;i<preLines.length;i++) out+=wPara(wRun(preLines[i]),{after:i===preLines.length-1?40:20,indent:"1620"});
  out += wPara(wRun("DESCRIPCIÓN: ",true)+wRun(c.description||""),{after:240,jc:"both"});
  out += `<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="2" w:space="1" w:color="CCCCCC"/></w:pBdr><w:spacing w:before="0" w:after="100"/></w:pPr></w:p>`;
  return out;
}
async function generateDocx(selectedCourses, programName, generalText="") {
  const depts = DEPT_ORDER.filter(d=>selectedCourses.some(c=>c.department===d))
    .concat(selectedCourses.map(c=>c.department).filter(d=>!DEPT_ORDER.includes(d)).filter((v,i,a)=>a.indexOf(v)===i));
  let body = "";
  if (generalText.trim()) {
    const lines = generalText.split('\n');
    for (const line of lines) body += wPara(wRun(line), {after:80});
    body += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
  }
  body += wPara(wRun("MATERIAS OPTATIVAS — OTOÑO 2026",true,28,"1F3864"),{after:80,jc:"center"});
  body += wPara(wRun(programName||"",false,22,"555555"),{after:360,jc:"center"});
  for(const dept of depts){
    const courses=selectedCourses.filter(c=>c.department===dept);
    if(!courses.length) continue;
    const dn=DEPT_DISPLAY[dept]||dept.toUpperCase();
    body+=`<w:p><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="1F3864"/><w:spacing w:before="240" w:after="120"/><w:ind w:left="120"/></w:pPr>${wRun(dn,true,24,"FFFFFF")}</w:p>`;
    courses.forEach(c=>{body+=courseToXml(c);});
  }
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip = new JSZip();
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  zip.file("word/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="es-MX"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:spacing w:after="0"/></w:pPr></w:style></w:styles>`);
  zip.file("word/document.xml",docXml);
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

// ─── EXCEL HELPERS ────────────────────────────────────────────────────────────
function guessDept(code) {
  const p = (code || '').split(/[-–]/)[0];
  return {ADM:'Administración',COM:'Computación',CON:'Contabilidad',ECO:'Economía',DER:'Derecho',EGN:'Estudios Generales',EIN:'Estudios Internacionales',IIO:'Ingeniería Industrial y Operaciones',MAT:'Matemáticas',SDI:'Ingeniería / Interdepartamental',CEB:'Bienestar / Formación General',CSO:'Ciencia Política'}[p] || p;
}

// ─── STEP BAR ─────────────────────────────────────────────────────────────────
function StepBar({step}) {
  const steps=["Subir Excel","Seleccionar materias","Generar documento"];
  return (
    <div style={{display:"flex",alignItems:"center",marginBottom:28}}>
      {steps.map((s,i)=>{
        const n=i+1,active=step===n,done=step>n;
        return (
          <React.Fragment key={n}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:done?"#15803d":active?"#1F3864":"#e2e8f0",color:(done||active)?"#fff":"#94a3b8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontFamily:"'DM Mono',monospace",fontWeight:500,transition:"all .3s"}}>
                {done?"✓":n}
              </div>
              <span style={{fontSize:13,color:active?"#1F3864":done?"#15803d":"#94a3b8",fontWeight:active?500:400,whiteSpace:"nowrap",transition:"color .3s"}}>{s}</span>
            </div>
            {i<steps.length-1 && <div className="step-line" style={{background:done?"#86efac":"#e2e8f0"}}/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [step, setStep] = useState(1);
  const [allCourses, setAllCourses] = useState([]);
  const [xlsxStatus, setXlsxStatus] = useState(null); // null | 'loading' | 'done' | 'error'
  const [xlsxFileName, setXlsxFileName] = useState(null);
  const [xlsxError, setXlsxError] = useState(null);
  const [xlsxDragOver, setXlsxDragOver] = useState(false);
  const xlsxInputRef = useRef();
  const [generalText, setGeneralText] = useState("");
  const [selected, setSelected] = useState(new Set());
  const [expandedDepts, setExpandedDepts] = useState(new Set());
  const [searchQuery, setSearchQuery] = useState("");
  const [selectedPrograms, setSelectedPrograms] = useState([]);
  const [generating, setGenerating] = useState(false);
  const [genDone, setGenDone] = useState(false);

  const toggleProgram = useCallback((prog) => {
    setSelectedPrograms(prev =>
      prev.includes(prog) ? prev.filter(p => p !== prog)
      : prev.length >= 2  ? prev
      : [...prev, prog]
    );
  }, []);

  const programName = selectedPrograms.join(" / ");

  const loadXlsx = useCallback((file) => {
    if (!file.name.endsWith('.xlsx')) {
      setXlsxError('Por favor sube un archivo .xlsx válido');
      setXlsxStatus('error');
      setXlsxFileName(file.name);
      return;
    }
    setXlsxFileName(file.name);
    setXlsxError(null);
    setXlsxStatus('loading');
    setAllCourses([]);
    setSelected(new Set());
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});
        const parsed = [];
        for (const row of rows) {
          const dept = String(row[0] || '').trim();
          const code = String(row[1] || '').trim();
          if (!code || !code.match(/^[A-Z]{2,4}[-–]\d/)) continue;
          parsed.push({
            department: dept || guessDept(code),
            code,
            title: String(row[2] || '').trim(),
            professor: String(row[3] || '').trim(),
            prerequisites: String(row[4] || '').trim(),
            description: String(row[5] || '').trim()
          });
        }
        if (!parsed.length) {
          setXlsxStatus('error');
          setXlsxError('No se encontraron materias. Verifica que el archivo tenga el formato correcto (columnas A-F).');
          return;
        }
        setAllCourses(parsed);
        setSelected(new Set(parsed.map(c => c.code)));
        setXlsxStatus('done');
      } catch(err) {
        setXlsxStatus('error');
        setXlsxError('Error al leer el archivo: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }, []);

  // ── grouping ──
  const grouped={};
  for(const c of allCourses){const d=c.department||"Otro";if(!grouped[d])grouped[d]=[];grouped[d].push(c);}
  const deptsSorted=DEPT_ORDER.filter(d=>grouped[d]?.length).concat(Object.keys(grouped).filter(d=>!DEPT_ORDER.includes(d)&&grouped[d]?.length));

  const q=searchQuery.toLowerCase();
  const filteredGrouped={};
  for(const dept of deptsSorted){
    const m=(grouped[dept]||[]).filter(c=>!q||c.code?.toLowerCase().includes(q)||c.title?.toLowerCase().includes(q)||c.professor?.toLowerCase().includes(q));
    if(m.length) filteredGrouped[dept]=m;
  }
  const filteredDepts=deptsSorted.filter(d=>filteredGrouped[d]);

  // ── selection ──
  const toggleCourse=code=>setSelected(prev=>{const n=new Set(prev);n.has(code)?n.delete(code):n.add(code);return n;});
  const toggleDeptSel=dept=>{
    const codes=(filteredGrouped[dept]||[]).map(c=>c.code);
    const allIn=codes.every(code=>selected.has(code));
    setSelected(prev=>{const n=new Set(prev);codes.forEach(code=>allIn?n.delete(code):n.add(code));return n;});
  };
  const selectAllInDept=dept=>{
    const codes=(filteredGrouped[dept]||[]).map(c=>c.code);
    setSelected(prev=>{const n=new Set(prev);codes.forEach(code=>n.add(code));return n;});
  };
  const deselectAllInDept=dept=>{
    const codes=(filteredGrouped[dept]||[]).map(c=>c.code);
    setSelected(prev=>{const n=new Set(prev);codes.forEach(code=>n.delete(code));return n;});
  };
  const toggleExpand=dept=>setExpandedDepts(prev=>{const n=new Set(prev);n.has(dept)?n.delete(dept):n.add(dept);return n;});
  const selectAll=()=>setSelected(new Set(allCourses.map(c=>c.code)));
  const deselectAll=()=>setSelected(new Set());
  const selectedCourses=allCourses.filter(c=>selected.has(c.code));

  // ── generate ──
  const handleGenerate=async()=>{
    setGenerating(true);setGenDone(false);
    try{
      const blob=await generateDocx(selectedCourses,programName,generalText);
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download="Optativas_Otono_2026.docx";a.click();
      URL.revokeObjectURL(url);
      setGenDone(true);
    }catch(e){alert("Error al generar: "+e.message);}
    finally{setGenerating(false);}
  };

  // ── shared styles ──
  const card={background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"24px 28px",marginBottom:16};

  return (
    <div style={{minHeight:"100vh",background:"#f5f4f0",fontFamily:"'Crimson Pro',Georgia,serif"}}>

      {/* HEADER */}
      <div style={{background:"#1F3864",padding:"20px 32px 18px",borderBottom:"3px solid #e8b84b"}}>
        <div style={{maxWidth:920,margin:"0 auto"}}>
          <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#8fa4cc",letterSpacing:".12em",marginBottom:4,textTransform:"uppercase"}}>ITAM · División Académica de Ingeniería · Otoño 2026</div>
          <div style={{color:"#e8ecf4",fontSize:22,fontWeight:500}}>Generador de Boletín de Optativas</div>
          <div style={{color:"#7f9abf",fontSize:13,marginTop:2}}>Carga el Excel con las materias · selecciona las que incluir · genera el Word</div>
        </div>
      </div>

      <div style={{maxWidth:920,margin:"0 auto",padding:"28px 20px"}}>
        <StepBar step={step}/>

        {/* ════════ STEP 1: UPLOAD EXCEL ════════ */}
        {step===1 && (
          <div className="fade">
            <div style={card}>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:18,fontWeight:500,color:"#1a1a1a",marginBottom:3}}>Sube el archivo Excel de optativas</div>
                <div style={{fontSize:13,color:"#64748b"}}>
                  Columnas: <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,background:"#ebe9e3",padding:"1px 5px",borderRadius:3}}>A: Departamento · B: Código · C: Título · D: Profesor · E: Prerrequisitos · F: Descripción</span>
                </div>
              </div>

              <div className={`drop-z${xlsxDragOver?" over":""}`}
                onDragOver={e=>{e.preventDefault();setXlsxDragOver(true);}}
                onDragLeave={()=>setXlsxDragOver(false)}
                onDrop={e=>{e.preventDefault();setXlsxDragOver(false);if(e.dataTransfer.files[0])loadXlsx(e.dataTransfer.files[0]);}}
                onClick={()=>xlsxInputRef.current?.click()}>
                <div style={{fontSize:32,marginBottom:8}}>📊</div>
                <div style={{fontSize:15,color:"#334155",marginBottom:3}}>Arrastra el <code style={{fontFamily:"'DM Mono',monospace",fontSize:12,background:"#ebe9e3",padding:"1px 6px",borderRadius:3}}>.xlsx</code> aquí</div>
                <div style={{fontSize:12,color:"#94a3b8"}}>o haz clic para seleccionar</div>
                <input ref={xlsxInputRef} type="file" accept=".xlsx" style={{display:"none"}} onChange={e=>{if(e.target.files[0])loadXlsx(e.target.files[0]);e.target.value="";}}/>
              </div>

              {xlsxStatus && (
                <div style={{background:xlsxStatus==='done'?"#f0fdf4":xlsxStatus==='error'?"#fef2f2":"#eff6ff",border:`1px solid ${xlsxStatus==='done'?"#bbf7d0":xlsxStatus==='error'?"#fecaca":"#bfdbfe"}`,borderRadius:6,padding:"9px 13px",marginBottom:7}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:16}}>📊</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"#1e293b",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{xlsxFileName}</div>
                      {xlsxStatus==='done'&&<div style={{fontSize:11,color:"#15803d"}}>{allCourses.length} materias · {[...new Set(allCourses.map(c=>c.department))].length} departamentos</div>}
                      {xlsxError&&<div style={{fontSize:11,color:"#b91c1c",marginTop:2}}>{xlsxError}</div>}
                    </div>
                    {xlsxStatus==='loading'&&<div className="spinner" style={{width:13,height:13,border:"2px solid #bfdbfe",borderTopColor:"#1d4ed8"}}/>}
                    <span style={{fontSize:13,color:xlsxStatus==='done'?"#15803d":xlsxStatus==='error'?"#b91c1c":"#1d4ed8",fontWeight:600}}>
                      {xlsxStatus==='done'?"✓":xlsxStatus==='error'?"✗":"⚙"}
                    </span>
                    {xlsxStatus!=='loading'&&<button onClick={()=>{setXlsxStatus(null);setXlsxFileName(null);setXlsxError(null);setAllCourses([]);setSelected(new Set());}} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:17,lineHeight:1,padding:"0 2px"}}>×</button>}
                  </div>
                  {xlsxStatus==='loading'&&<div className="prog-bar"><div className="prog-inner"/></div>}
                </div>
              )}

              {allCourses.length>0 && (
                <div style={{display:"flex",gap:12,alignItems:"center",marginTop:16,flexWrap:"wrap"}}>
                  <button className="btn-green" onClick={()=>setStep(2)}>→ Revisar selección ({allCourses.length} materias)</button>
                  <button className="btn-sec" onClick={()=>{setXlsxStatus(null);setXlsxFileName(null);setXlsxError(null);setAllCourses([]);setSelected(new Set());}}>Limpiar</button>
                </div>
              )}

              {!xlsxStatus && (
                <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"16px 20px",marginTop:4}}>
                  <div style={{fontSize:11,color:"#94a3b8"}}>La columna Departamento puede quedar en blanco — se infiere del código de materia (ECO, IIO, ADM…)</div>
                </div>
              )}
            </div>

            {/* ── Notas generales (opcional) ── */}
            <div style={{...card,marginBottom:0}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:16,fontWeight:500,color:"#1a1a1a",marginBottom:2}}>Notas generales — información previa</div>
                  <div style={{fontSize:12,color:"#94a3b8"}}>Opcional · Aparecerá al inicio del boletín, antes de las materias.</div>
                </div>
                {generalText.trim()&&<span style={{fontFamily:"'DM Mono',monospace",fontSize:10,background:"#15803d",color:"#f0fdf4",padding:"2px 8px",borderRadius:3}}>incluido</span>}
              </div>
              <textarea
                value={generalText}
                onChange={e=>setGeneralText(e.target.value)}
                placeholder="Pega o escribe aquí las notas al plan de estudios…"
                style={{width:"100%",minHeight:130,fontFamily:"'Crimson Pro',Georgia,serif",fontSize:14,border:"1px solid #e2e8f0",borderRadius:6,padding:"10px 14px",resize:"vertical",outline:"none",color:"#1e293b",background:"#fafafa",lineHeight:1.6,transition:"border .15s"}}
                onFocus={e=>e.target.style.borderColor="#1F3864"}
                onBlur={e=>e.target.style.borderColor="#e2e8f0"}
              />
              {generalText.trim()&&(
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:6}}>
                  <button className="btn-sec" style={{fontSize:12,padding:"4px 12px"}} onClick={()=>setGeneralText("")}>Limpiar</button>
                </div>
              )}
            </div>
          </div>
        )}

        {/* ════════ STEP 2: SELECT ════════ */}
        {step===2&&(
          <div className="fade">
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
              <input className="search-bar" style={{flex:1,minWidth:200}} placeholder="Buscar por código, título o profesor…" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}/>
              <button className="btn-sec" style={{fontSize:13,padding:"8px 14px",whiteSpace:"nowrap"}} onClick={selectAll}>Todo</button>
              <button className="btn-sec" style={{fontSize:13,padding:"8px 14px",whiteSpace:"nowrap"}} onClick={deselectAll}>Ninguno</button>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"#64748b",whiteSpace:"nowrap"}}>
                <span style={{color:"#1F3864",fontWeight:500}}>{selected.size}</span>/{allCourses.length} seleccionadas
              </span>
            </div>

            <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,overflow:"hidden",marginBottom:14,maxHeight:500,overflowY:"auto"}}>
              {filteredDepts.map((dept,di)=>{
                const dCourses=filteredGrouped[dept]||[];
                const selIn=dCourses.filter(c=>selected.has(c.code)).length;
                const allIn=selIn===dCourses.length;
                const partial=selIn>0&&!allIn;
                const isOpen=expandedDepts.has(dept);
                const color=DEPT_COLORS[dept]||"#475569";
                const bg=DEPT_BG[dept]||"#f8fafc";
                return (
                  <div key={dept} style={{borderBottom:di<filteredDepts.length-1?"1px solid #e2e8f0":"none"}}>
                    <div className="dept-hdr" style={{background:isOpen?bg+"cc":"#fff",gap:8}}>
                      <div style={{flex:1,display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>toggleExpand(dept)}>
                        <span style={{color,fontSize:11,transition:"transform .2s",display:"inline-block",transform:isOpen?"rotate(90deg)":"none"}}>▶</span>
                        <span style={{fontSize:14,fontWeight:500,color:"#1e293b"}}>{dept}</span>
                        <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,background:bg,color,border:`1px solid ${color}22`,padding:"1px 7px",borderRadius:3}}>{selIn}/{dCourses.length}</span>
                      </div>
                      <button onClick={()=>selectAllInDept(dept)} style={{flexShrink:0,padding:"3px 9px",border:`1px solid ${color}`,borderRadius:4,background:"transparent",color,fontSize:11,fontFamily:"'DM Mono',monospace",cursor:"pointer",whiteSpace:"nowrap"}}>
                        + Sel. todo
                      </button>
                      <button onClick={()=>deselectAllInDept(dept)} style={{flexShrink:0,padding:"3px 9px",border:"1px solid #e2e8f0",borderRadius:4,background:"transparent",color:"#94a3b8",fontSize:11,fontFamily:"'DM Mono',monospace",cursor:"pointer",whiteSpace:"nowrap"}}>
                        − Quitar todo
                      </button>
                    </div>
                    {isOpen&&dCourses.map(c=>{
                      const isSel=selected.has(c.code);
                      return (
                        <div key={c.code} className="course-row" style={{background:isSel?bg+"55":"transparent",paddingLeft:38,alignItems:"center",cursor:"default"}}>
                          <span className="pill" style={{marginTop:0}}>{c.code}</span>
                          <div style={{flex:1}}>
                            <div style={{fontSize:13,fontWeight:isSel?500:400,color:isSel?"#1e293b":"#374151",lineHeight:1.35}}>{c.title}</div>
                            <div style={{fontSize:11,color:"#64748b",marginTop:2,fontFamily:"'DM Mono',monospace"}}>{c.professor}</div>
                            {c.prerequisites&&c.prerequisites!=="Ninguno"&&(
                              <div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>Prereq: {c.prerequisites.length>72?c.prerequisites.slice(0,72)+"…":c.prerequisites}</div>
                            )}
                          </div>
                          <button onClick={()=>toggleCourse(c.code)} style={{flexShrink:0,padding:"4px 11px",border:isSel?"1px solid #fca5a5":"1px solid #1F3864",borderRadius:5,background:isSel?"#fef2f2":"#1F3864",color:isSel?"#b91c1c":"#e8ecf4",fontSize:12,fontFamily:"'DM Mono',monospace",cursor:"pointer",whiteSpace:"nowrap",transition:"all .12s"}}>
                            {isSel?"× Quitar":"✓ Agregar"}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
              {filteredDepts.length===0&&(
                <div style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:14}}>No se encontraron materias para "{searchQuery}"</div>
              )}
            </div>

            {selected.size>0&&(
              <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"12px 16px",marginBottom:14}}>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#64748b",letterSpacing:".04em",marginBottom:7}}>SELECCIONADAS ({selected.size})</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {selectedCourses.slice(0,28).map(c=>(
                    <span key={c.code} className="tag-chip" style={{background:DEPT_BG[c.department]||"#f1f5f9",color:DEPT_COLORS[c.department]||"#475569",border:`1px solid ${(DEPT_COLORS[c.department]||"#cbd5e1")}22`}}>
                      <span style={{fontFamily:"'DM Mono',monospace",fontSize:10}}>{c.code}</span>
                      <button onClick={()=>toggleCourse(c.code)} style={{background:"none",border:"none",cursor:"pointer",color:"inherit",fontSize:13,lineHeight:1,opacity:.6,padding:0}}>×</button>
                    </span>
                  ))}
                  {selected.size>28&&<span style={{fontSize:12,color:"#94a3b8",padding:"3px 0"}}>+{selected.size-28} más</span>}
                </div>
              </div>
            )}

            <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
              <button className="btn-sec" onClick={()=>setStep(1)}>← Volver</button>
              <button className="btn-green" onClick={()=>{if(selected.size>0)setStep(3);}} disabled={selected.size===0}>
                → Continuar con {selected.size} materia{selected.size!==1?"s":""}
              </button>
            </div>
          </div>
        )}

        {/* ════════ STEP 3: GENERATE ════════ */}
        {step===3&&(
          <div className="fade">
            <div style={card}>
              <div style={{fontSize:18,fontWeight:500,color:"#1a1a1a",marginBottom:4}}>Configurar y generar documento</div>
              <div style={{fontSize:13,color:"#64748b",marginBottom:18}}>Selecciona el programa o los programas (máximo 2) para el boletín.</div>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <label style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:"#64748b",letterSpacing:".04em"}}>PROGRAMA(S)</label>
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,color:selectedPrograms.length===2?"#1F3864":"#94a3b8"}}>
                  {selectedPrograms.length}/2 seleccionados
                </span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:7,marginBottom:selectedPrograms.length>0?12:20}}>
                {PROGRAMS.map(prog=>{
                  const isSel=selectedPrograms.includes(prog);
                  const isDisabled=!isSel&&selectedPrograms.length>=2;
                  return (
                    <button key={prog} onClick={()=>toggleProgram(prog)}
                      style={{padding:"6px 14px",border:isSel?"1.5px solid #1F3864":"1px solid #d1d5db",borderRadius:6,background:isSel?"#1F3864":"#fff",color:isSel?"#e8ecf4":isDisabled?"#c8c4bc":"#334155",fontSize:13,fontFamily:"'Crimson Pro',serif",cursor:isDisabled?"default":"pointer",transition:"all .12s",opacity:isDisabled?.45:1,fontWeight:isSel?500:400}}>
                      {prog}
                    </button>
                  );
                })}
              </div>
              {selectedPrograms.length>0&&(
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,padding:"9px 14px",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6}}>
                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#1d4ed8",letterSpacing:".04em",flexShrink:0}}>BOLETÍN PARA:</span>
                  <span style={{fontSize:14,color:"#1e293b",fontWeight:500,flex:1}}>{programName}</span>
                  <button onClick={()=>setSelectedPrograms([])} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:16,lineHeight:1,padding:0,flexShrink:0}}>×</button>
                </div>
              )}

              <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#64748b",letterSpacing:".04em",marginBottom:10}}>RESUMEN — {selected.size} MATERIAS</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:22}}>
                {deptsSorted.filter(d=>selectedCourses.some(c=>c.department===d)).map(d=>{
                  const cnt=selectedCourses.filter(c=>c.department===d).length;
                  const color=DEPT_COLORS[d]||"#475569";
                  const bg=DEPT_BG[d]||"#f8fafc";
                  return (
                    <div key={d} style={{display:"flex",alignItems:"center",gap:7,background:bg,border:`1px solid ${color}33`,borderRadius:5,padding:"5px 11px 5px 8px"}}>
                      <span style={{fontFamily:"'DM Mono',monospace",fontSize:11,background:color,color:"#fff",padding:"1px 6px",borderRadius:3,fontWeight:500}}>{cnt}</span>
                      <span style={{fontSize:13,color}}>{d}</span>
                    </div>
                  );
                })}
              </div>

              {/* Doc preview */}
              <div style={{border:"1px solid #e2e8f0",borderRadius:8,overflow:"hidden",marginBottom:24}}>
                <div style={{background:"#1F3864",padding:"7px 16px"}}>
                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:"#8fa4cc",letterSpacing:".08em"}}>VISTA PREVIA</span>
                </div>
                <div style={{padding:"16px",maxHeight:220,overflowY:"auto",background:"#fafafa",fontFamily:"Arial,sans-serif"}}>
                  <div style={{textAlign:"center",marginBottom:8}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#1F3864"}}>MATERIAS OPTATIVAS — OTOÑO 2026</div>
                    <div style={{fontSize:11,color:"#555",marginTop:2}}>{programName}</div>
                  </div>
                  {deptsSorted.filter(d=>selectedCourses.some(c=>c.department===d)).map(d=>(
                    <div key={d} style={{marginBottom:6}}>
                      <div style={{background:"#1F3864",color:"#fff",padding:"3px 8px",fontSize:9,fontWeight:700,letterSpacing:".04em",marginBottom:3}}>{DEPT_DISPLAY[d]||d.toUpperCase()}</div>
                      {selectedCourses.filter(c=>c.department===d).map(c=>(
                        <div key={c.code} style={{fontSize:10,marginBottom:4,paddingLeft:4,borderLeft:"2px solid #e2e8f0"}}>
                          <span style={{fontWeight:700}}>{c.code}</span> <span style={{fontWeight:700}}>{c.title}</span>
                          <div style={{color:"#555"}}><strong>PROFESOR:</strong> {c.professor}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>

              <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                <button className="btn-sec" onClick={()=>{setStep(2);setGenDone(false);}}>← Editar selección</button>
                <button className="btn-green" onClick={handleGenerate} disabled={generating||selectedPrograms.length===0}>
                  {generating?<><div className="spinner" style={{width:14,height:14,border:"2px solid #86efac",borderTopColor:"#f0fdf4"}}/>Generando…</>:<>↓ Descargar Word (.docx)</>}
                </button>
                {selectedPrograms.length===0&&<span style={{fontSize:12,color:"#94a3b8"}}>Selecciona al menos un programa</span>}
                {genDone&&(
                  <div style={{display:"flex",alignItems:"center",gap:7,background:"#f0fdf4",border:"1px solid #86efac",borderRadius:5,padding:"8px 14px",fontSize:13,color:"#15803d"}}>
                    ✓ Documento descargado correctamente
                  </div>
                )}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
